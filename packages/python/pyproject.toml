[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "ai2human"
version = "0.1.0.dev1"
description = "Official Python client for AI2Human human-execution tasks"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]
license = {text = "MIT"}
[tool.hatch.build.targets.wheel]
packages = ["src/ai2human"]
