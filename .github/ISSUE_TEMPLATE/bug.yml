name: SDK bug
description: Report a reproducible SDK or Mock Server defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes: { label: Package, options: [TypeScript SDK, Python SDK, Mock Server, OpenAPI] }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Minimal reproduction }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
